project_id = "pivot"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "http://localhost:8443"
additional_redirect_urls = ["http://localhost:8443"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Local development only — the hosted project keeps its own dashboard settings.
enable_confirmations = false

[functions.ingest]
verify_jwt = true

[functions.process]
# Called by pg_cron with the service role key; the handler checks it itself.
verify_jwt = false
